packages:
  - "apps/*"
  - "packages/*"
# React Native / Metro need a flat node_modules; pnpm's default isolated linker
# breaks Metro in clean installs (e.g. EAS Build). Hoisted matches RN's expectations.
nodeLinker: hoisted
allowBuilds:
  '@sentry/cli': set this to true or false
  esbuild: true
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@posthog/core@1.38.1'
  - '@posthog/types@1.392.0'
  - posthog-react-native@4.53.2
